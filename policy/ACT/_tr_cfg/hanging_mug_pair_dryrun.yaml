# Joint training dry-run for ACT (hanging_mug + unhanging_mug).
# - Keeps TRAIN_TASKS identical to the original example.
# - Reduces TRAIN_NUM_EPOCHS and enables early stopping so the run finishes quickly.
#
# Expected checkpoints:
#   act_ckpt/act-hanging_mug__unhanging_mug/demo_clean__demo_clean-<sum_episodes>/

TRAIN_TASKS:
  - [hanging_mug, demo_clean, 100]
  - [unhanging_mug, demo_clean, 100]

TRAIN_SEED: 0
TRAIN_GPU_ID: 0

# Training duration control (early stopping should dominate)
TRAIN_NUM_EPOCHS: 200
TRAIN_SAVE_FREQ: 2000
TRAIN_BATCH_SIZE: 8
TRAIN_LR: 1.0e-5
TRAIN_STATE_DIM: 14

# ACT model hyper-parameters (defaults aligned with hanging_mug_pair.yaml)
ACT_KL_WEIGHT: 10
ACT_CHUNK_SIZE: 50
ACT_HIDDEN_DIM: 512
ACT_DIM_FEEDFORWARD: 3200

# Early stopping (used by imitate_episodes.py)
EARLY_STOP_PATIENCE_EVALS: 1
EARLY_STOP_REL_TOL: 10.0
EVAL_STEPS_FOR_EARLY_STOP: 20

