# ============================================================
# ACT Evaluation Tasks Configuration
# ============================================================
# Checkpoints located at: policy/ACT/ckpt/
# GPU: 0 (ACT uses card 0)
# ============================================================

gpu_parallel: [0]

model_defaults:
  test_num: 50
  end_reset_to_init: false
  seed: 0

ev_tasks:
  - task_id: move_pillbottle_pad
    ckpt_dir: policy/ACT/ckpt/move_pillbottle_100
    eval_tasks:
      - [move_pillbottle_pad, demo_clean, 100]

  - task_id: hanging_mug
    ckpt_dir: policy/ACT/ckpt/hanging_mug_100
    eval_tasks:
      - [hanging_mug, demo_clean, 100]

  - task_id: stack_blocks_three
    ckpt_dir: policy/ACT/ckpt/stack_blocks_100
    eval_tasks:
      - [stack_blocks_three, demo_clean, 100]

  - task_id: stack_bowls_three
    ckpt_dir: policy/ACT/ckpt/stack_bowls_100
    eval_tasks:
      - [stack_bowls_three, demo_clean, 100]
