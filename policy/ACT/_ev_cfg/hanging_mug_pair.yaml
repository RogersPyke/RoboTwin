#   policy/ACT/act_ckpt/act-hanging_mug__unhanging_mug/demo_clean__demo_clean-<sum_episodes>/
# TRAIN_TASKS must match the joint train run. Run: bash eval.sh --config hanging_mug_pair

TRAIN_TASKS:
  - [hanging_mug, demo_clean, 100]
  - [unhanging_mug, demo_clean, 100]
EVAL_TASKS:
  - [hanging_mug, demo_clean, 100]
EVAL_SEED: 0
EVAL_GPU_ID: 0
