# ============================================================
# DP Evaluation Tasks Configuration
# ============================================================
# Checkpoints located at: policy/DP/ckpt/
# GPU: 1 (DP uses card 1)
# ============================================================

gpu_parallel: [1]

model_defaults:
  test_num: 50
  end_reset_to_init: true
  seed: 0
  checkpoint_num: 10000
  eval_head_camera_type: D435

ev_tasks:
  - task_id: move_pillbottle_pad
    ckpt_dir: policy/DP/ckpt/move_pillbottle_100
    eval_tasks:
      - [move_pillbottle_pad, demo_clean, 100]

  - task_id: hanging_mug
    ckpt_dir: policy/DP/ckpt/hanging_mug_100
    eval_tasks:
      - [hanging_mug, demo_clean, 100]

  - task_id: stack_blocks_three
    ckpt_dir: policy/DP/ckpt/stack_blocks_100
    eval_tasks:
      - [stack_blocks_three, demo_clean, 100]

  - task_id: stack_bowls_three
    ckpt_dir: policy/DP/ckpt/stack_bowls_100
    eval_tasks:
      - [stack_bowls_three, demo_clean, 100]
