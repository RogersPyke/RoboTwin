# TinyVLA joint-training wrapper config example.
# The wrapper will:
# - combine TRAIN_TASKS into one joint task spec
# - auto-create output_dir under policy/TinyVLA/tinyvla_ckpt/
# - inject top-level early-stop args into train_vla.py
#
# Each base task must still exist in aloha_scripts/constants.py.

TRAIN_TASKS:
  - [task_name_a, demo_clean, 100]
  - [task_name_b, demo_clean, 100]

TRAIN_SEED: 0
TRAIN_GPU_ID: "0"

# ACT-aligned early stopping. Keep both <= 0 to disable.
EARLY_STOP_PATIENCE_EVALS: 3
EARLY_STOP_REL_TOL: 0.01
EVAL_STEPS_FOR_EARLY_STOP: 100

# Optional DeepSpeed launcher config.
DEEPSPEED:
  enabled: false
  num_gpus: 8
  master_port: 29604
  zero2_json: scripts/zero2.json

# Args mapping passed to TinyVLA/train_vla.py via HfArgumentParser.
# Flags should be exactly the dataclass field names (without leading --).
# Do not set output_dir or joint_task_spec here; the wrapper owns them.
VLA_TRAIN_ARGS:
  # DataArguments
  skip_mirrored_data: false
  episode_first: false
  chunk_size: 16

  # ActionHeadArguments
  policy_head_type: unet_diffusion_policy
  state_dim: 14
  action_dim: 14
  noise_samples: 8

  # ModelArguments
  model_name_or_path: /path/to/TinyVLA-v2/model_param/InternVL3-1B/
  flash_attn: true

  # TrainingArguments
  max_steps: 5000
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1

  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 50

  learning_rate: 2.0e-5
  weight_decay: 0.0
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.0

  logging_steps: 5
  bf16: true
  tf32: true
  gradient_checkpointing: true
  dataloader_num_workers: 8
  report_to: "tensorboard"

