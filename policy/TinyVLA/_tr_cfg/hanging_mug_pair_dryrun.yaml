# TinyVLA joint training dry-run.
# Joint tasks: hanging_mug + unhanging_mug (same demo_clean).

TRAIN_TASKS:
  - [hanging_mug, demo_clean, 100]
  - [unhanging_mug, demo_clean, 100]

TRAIN_SEED: 0
TRAIN_GPU_ID: "0"

EARLY_STOP_PATIENCE_EVALS: 0
EARLY_STOP_REL_TOL: 0.01
EVAL_STEPS_FOR_EARLY_STOP: 1

DEEPSPEED:
  enabled: false

VLA_TRAIN_ARGS:
  # DataArguments
  skip_mirrored_data: false
  episode_first: false
  chunk_size: 16

  # ActionHeadArguments
  policy_head_type: unet_diffusion_policy
  state_dim: 14
  action_dim: 14
  noise_samples: 2

  # ModelArguments
  model_name_or_path: /home/rogerspyke/projects/thesis-draft-dev/third_party/RoboTwin/policy/TinyVLA/model_param/InternVL3-1B/
  flash_attn: false

  # TrainingArguments
  max_steps: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1

  save_strategy: "steps"
  save_steps: 1
  save_total_limit: 1

  # Avoid eval to reduce OOM risk during this dry-run.
  evaluation_strategy: "no"
  eval_steps: 1

  learning_rate: 2.0e-5
  weight_decay: 0.0
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.0

  logging_steps: 1

  # Reduce memory footprint
  bf16: true
  tf32: false
  gradient_checkpointing: true
  dataloader_num_workers: 1
  report_to: "none"

  # Freeze large backbones to reduce OOM risk
  freeze_vision_tower: true
  freeze_backbone: true

