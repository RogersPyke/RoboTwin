# TinyVLA joint-eval wrapper config example.
# TRAIN_TASKS must exactly match the joint-training config so the wrapper can
# resolve the shared checkpoint directory under policy/TinyVLA/tinyvla_ckpt/.

TRAIN_TASKS:
  - [task_name_a, demo_clean, 100]
  - [task_name_b, demo_clean, 100]

EVAL_TASKS:
  - [task_name_a, demo_clean, 100]
  - [task_name_b, demo_clean, 100]

EVAL_SEED: 0
EVAL_GPU_ID: "0"

MODEL_BASE: /path/to/TinyVLA-v2/model_param/InternVL3-1B/

# If true, model_path is the auto-derived joint output_dir/policy_best.
USE_POLICY_BEST: true

INSTRUCTION_TYPE: unseen
ENABLE_LORE: false

