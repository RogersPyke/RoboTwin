# Embodied Mixup first-round RoboTwin protocol.
# The Piper separation is read from the official embodiment asset after setup.
render_freq: 0
episode_num: 200
use_seed: false
save_freq: 15
embodiment: [piper, piper, 0.60]
language_num: 0
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: false
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  # Auxiliary only: it is converted to observation.eef_pose for EMIX indexing
  # and is never declared as a policy input.
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
