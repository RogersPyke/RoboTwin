# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 1
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true

# =============================================================================
# END_RESET_TO_INIT: Reset robot arms to origin after task completion.
#                   Works for both pert and non-pert tasks.
#                   If true, arms return to home position after each episode.
# =============================================================================
END_RESET_TO_INIT: true

# =============================================================================
# Perturbation Configuration (only for *_pert tasks)
# =============================================================================
# enabled: Global switch for perturbation. If false, no perturbation is applied.
#
# Segment-level configuration can be set here as defaults, overridden by task files.
#
# Parameter Description:
# ----------------------
# Position/Orientation Jitter (applied to target pose):
#   xy_jitter: float (meters) - max random offset for x and y axes
#              Example: 0.010 means each axis gets random offset in [-0.010, 0.010]
#   yaw_jitter_deg: float (degrees) - max random yaw rotation
#                   Example: 8.0 means random rotation in [-8.0, 8.0] degrees
#
# Waypoint Chain Parameters (for trajectory planning with intermediate waypoints):
#   waypoint_count_min: int - minimum number of intermediate waypoints (default: 1)
#   waypoint_count_max: int - maximum number of intermediate waypoints (default: 2)
#   waypoint_xy_radius: float (meters) - max lateral distance from direct path
#                     Example: 0.08 means waypoints can deviate up to 8cm sideways
#   waypoint_z_jitter: float (meters) - max z offset for waypoints (default: 0.05)
#   orientation_jitter_deg: float (degrees) - max orientation change (default: 10.0)
#
# RRT Anchor Parameters (alternative trajectory generation):
#   rrt_anchor_ratio_min: float - min ratio along path for anchor (default: 0.25)
#   rrt_anchor_ratio_max: float - max ratio along path for anchor (default: 0.75)
#   rrt_lateral_xy: float (meters) - max lateral offset for RRT anchor (default: 0.10)
#   rrt_z_jitter: float (meters) - max z jitter for RRT anchor (default: 0.04)
#
# Planning Parameters:
#   candidate_trials: int - number of candidate paths to generate (default: 6)
#   fallback_to_direct: bool - use direct path if all candidates fail (default: true)
#
# Usage in task files:
# --------------------
# Each segment in *_pert.py can override these defaults:
#   segments=[
#       {"enabled": True, "xy_jitter": 0.015, "waypoint_xy_radius": 0.12},
#       {"enabled": True, "xy_jitter": 0.002},
#   ]
# =============================================================================
perturbation:
  enabled: true
  # Default parameters (can be overridden in task files)
  defaults:
    xy_jitter: 0.008
    yaw_jitter_deg: 6.0
    waypoint_count_min: 1
    waypoint_count_max: 2
    waypoint_xy_radius: 0.08
    waypoint_z_jitter: 0.05
    orientation_jitter_deg: 10.0
    rrt_anchor_ratio_min: 0.25
    rrt_anchor_ratio_max: 0.75
    rrt_lateral_xy: 0.10
    rrt_z_jitter: 0.04
    candidate_trials: 6
    fallback_to_direct: true
