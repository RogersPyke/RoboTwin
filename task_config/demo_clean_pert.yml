# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 100
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true

perturbation:
  enabled: true
  grasp_xy_jitter: 0.008
  grasp_yaw_jitter_deg: 6.0
  pre_place_xy_jitter: 0.020
  conservative_xy_scale: 0.6
  conservative_yaw_scale: 0.5
  planner_augmentation:
    enabled: true
    strategies: [waypoint_chain, rrt_guided]
    candidate_trials: 6
    waypoint_count_min: 1
    waypoint_count_max: 2
    waypoint_xy_radius: 0.08
    waypoint_z_jitter: 0.05
    orientation_jitter_deg: 10.0
    rrt_anchor_ratio_min: 0.25
    rrt_anchor_ratio_max: 0.75
    rrt_lateral_xy: 0.10
    rrt_z_jitter: 0.04
    fallback_to_direct: true
    conservative_spatial_scale: 0.7
    conservative_orientation_scale: 0.6
